spring.application.name=demo
spring.datasource.url=jdbc:postgresql://localhost:5432/hackathon?TimeZone=Asia/Kolkata
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# T-2 routing engine — active strategy. Change via env var ROUTING_STRATEGY or
# edit here; the registry reads this on every call, no restart needed.
routing.strategy=rule-based

# T-3 LLM gateway config. Pick one provider.
# gemini | groq | ollama
llm.provider=gemini
llm.api-key=${LLM_API_KEY:}
llm.model=gemini-1.5-flash
llm.base-url=https://generativelanguage.googleapis.com

# Alternative configs (uncomment to use):
# llm.provider=groq
# llm.model=llama-3.1-8b-instant
# llm.base-url=https://api.groq.com
#
# llm.provider=ollama
# llm.model=llama3.1:8b
# llm.base-url=http://localhost:11434
